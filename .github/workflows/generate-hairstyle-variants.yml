name: Generate hairstyle reference variants

on:
  workflow_dispatch:
    inputs:
      reference_image:
        description: "Repository-relative path to an upright image with one character and the head near the top; only a head crop is sent to the editor"
        required: true
        type: string
      character_id:
        description: "Character bucket whose identity is being preserved"
        required: true
        type: choice
        options:
          - pibara
          - chie
          - sunna
          - personaje-4
          - personaje-5
      mode:
        description: "Preview crop first without API cost, or generate the selected hairstyle pack"
        required: true
        type: choice
        default: preview
        options:
          - preview
          - generate
      head_crop_height_ratio:
        description: "Vertical crop height relative to source image width"
        required: true
        type: choice
        default: "0.70"
        options:
          - "0.60"
          - "0.70"
          - "0.80"
      style_pack:
        description: "Preset pack with five or six hairstyle variations"
        required: true
        default: core-6
        type: choice
        options:
          - core-5
          - core-6
          - short-cuts
          - updos
          - bangs
          - waves-braids

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: hairstyle-variants-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository and source image
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Validate configuration and install image tools
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GENERATION_MODE: ${{ inputs.mode }}
          REFERENCE_IMAGE: ${{ inputs.reference_image }}
          CHARACTER_ID: ${{ inputs.character_id }}
          HEAD_CROP_HEIGHT_RATIO: ${{ inputs.head_crop_height_ratio }}
          STYLE_PACK: ${{ inputs.style_pack }}
        run: |
          set -euo pipefail
          if [ "$GENERATION_MODE" = "generate" ] && [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::Missing repository Actions secret OPENAI_API_KEY. Add it in Settings > Secrets and variables > Actions."
            exit 1
          fi
          python -m pip install --disable-pip-version-check pillow requests
          python -m py_compile scripts/generate_hairstyle_variants.py
          python - <<'PY'
          import os, re
          from pathlib import Path, PurePosixPath
          source = os.environ["REFERENCE_IMAGE"].strip()
          path = PurePosixPath(source)
          if not source or path.is_absolute() or ".." in path.parts:
              raise SystemExit("reference_image must be a repository-relative path without '..'.")
          if path.suffix.lower() not in {".png", ".jpg", ".jpeg", ".webp"}:
              raise SystemExit("Reference must be PNG, JPG/JPEG or WebP.")
          if not Path(*path.parts).is_file():
              raise SystemExit(f"Image path not found on this revision: {source}")
          if not re.fullmatch(r"[a-z0-9][a-z0-9-]{0,40}", os.environ["CHARACTER_ID"]):
              raise SystemExit("Invalid character id.")
          if os.environ["STYLE_PACK"] not in {"core-5", "core-6", "short-cuts", "updos", "bangs", "waves-braids"}:
              raise SystemExit("Invalid style pack.")
          ratio = float(os.environ["HEAD_CROP_HEIGHT_RATIO"])
          if not 0.55 <= ratio <= 0.90:
              raise SystemExit("Crop ratio must be between 0.55 and 0.90.")
          if os.environ["GENERATION_MODE"] not in {"preview", "generate"}:
              raise SystemExit("Mode must be preview or generate.")
          print(f"Validated source path: {source}")
          PY

      - name: Prepare reference crop or generate hairstyle variants
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GENERATION_MODE: ${{ inputs.mode }}
          HEAD_CROP_HEIGHT_RATIO: ${{ inputs.head_crop_height_ratio }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_WORKSPACE: ${{ github.workspace }}
          REFERENCE_IMAGE: ${{ inputs.reference_image }}
          CHARACTER_ID: ${{ inputs.character_id }}
          STYLE_PACK: ${{ inputs.style_pack }}
        run: python scripts/generate_hairstyle_variants.py

      - name: Upload generated preview as a workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hairstyle-variants-${{ inputs.character_id }}-${{ github.run_id }}
          path: generated/hairstyles/${{ inputs.character_id }}/run-${{ github.run_id }}/
          if-no-files-found: ignore
          retention-days: 14

      - name: Create a reviewable branch and pull request containing the images
        if: success() && inputs.mode == 'generate'
        env:
          GH_TOKEN: ${{ github.token }}
          CHARACTER_ID: ${{ inputs.character_id }}
          STYLE_PACK: ${{ inputs.style_pack }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          branch="generated/hairstyles-$CHARACTER_ID-$RUN_ID"
          path="generated/hairstyles/$CHARACTER_ID/run-$RUN_ID"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add "$path" data/character-prompt-registry.json
          git commit -m "Add $STYLE_PACK hairstyle references for $CHARACTER_ID"
          git push origin "$branch"
          gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --head "$branch" \
            --base main \
            --title "Hair reference variants: $CHARACTER_ID ($STYLE_PACK)" \
            --body "Generated by the manual IMAGE hairstyle workflow. Includes all individual image variants from the selected style pack, exact prompts, source SHA-256, recovered source prompt when available, a contact sheet and manifest. Review for identity drift before merging. Original images are not deleted or modified."

name: Validate IMAGE Character Creator
on:
  push:
    branches: [work/easy-avatar-maker-2026-10, main]
    paths:
      - "tools/avatar-maker/**"
      - "scripts/validate_avatar_maker.py"
      - "scripts/extract_avatar_psd_layers.py"
      - "requirements-avatar-assets.txt"
      - ".github/workflows/validate-avatar-maker.yml"
  pull_request:
    branches: [main]
    paths:
      - "tools/avatar-maker/**"
      - "scripts/validate_avatar_maker.py"
      - "scripts/extract_avatar_psd_layers.py"
      - "requirements-avatar-assets.txt"
      - ".github/workflows/validate-avatar-maker.yml"
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate illustration assets and inline JavaScript
        run: python scripts/validate_avatar_maker.py
      - name: Check PSD extraction and local AI bridge syntax
        run: python -m py_compile scripts/extract_avatar_psd_layers.py tools/avatar-maker/ai_edit_server.py

name: Render IMAGE hair asset preview

on:
  push:
    branches: [work/modular-character-editor-2026-10]
    paths:
      - "12.png"
      - "assets/parts/hair/cabello_01.svg"
      - "scripts/render_hair_preview.py"
      - "scripts/capture_editor_screenshot.py"
      - "ml/character_editor_server.py"
      - "tools/character-editor/**"
      - ".github/workflows/hair-preview.yml"
  pull_request:
    branches: [main]
    paths:
      - "12.png"
      - "assets/parts/hair/cabello_01.svg"
      - "scripts/render_hair_preview.py"
      - ".github/workflows/hair-preview.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source character and hairstyle
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install SVG renderer and image library
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2
          python -m pip install "Pillow>=10,<13" "CairoSVG>=2.7,<3" "playwright>=1.48,<2"
          python -m playwright install --with-deps chromium
      - name: Render composite preview without changing the original
        run: python scripts/render_hair_preview.py
      - name: Capture actual IMAGE editor with the character and hair layer
        run: python scripts/capture_editor_screenshot.py
      - name: Save the focused capture in the repository
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add screenshots/IMAGE-app-cabello-01-captura.jpg screenshots/IMAGE-app-edicion-animeart-panel.jpg screenshots/IMAGE-app-edicion-animeart-completo.png
          if git diff --cached --quiet; then
            echo "The IMAGE screenshots are unchanged; no repository commit is needed."
          else
            git commit -m "Save IMAGE editor and AnimeArt editing-panel screenshots"
            # Another workflow or documentation commit may advance the branch while
            # Chromium is running. Rebase this screenshot-only commit before pushing.
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Upload character, full app and advanced panel screenshots
        uses: actions/upload-artifact@v4
        with:
          name: IMAGE-Cabello-01-Preview
          path: preview-output/*
          if-no-files-found: error
          retention-days: 14

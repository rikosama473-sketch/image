name: Real anime cutout quality smoke test

on:
  push:
    branches: [work/easy-avatar-maker-2026-10, main]
    paths:
      - "scripts/run_real_anime_cutout_inference.py"
      - "requirements-avatar-cutout.txt"
      - "from-PixAI-2034984086876227343-0.png"
      - ".github/workflows/test-real-anime-cutout.yml"
  pull_request:
    branches: [main]
    paths:
      - "scripts/run_real_anime_cutout_inference.py"
      - "requirements-avatar-cutout.txt"
      - "from-PixAI-2034984086876227343-0.png"
      - ".github/workflows/test-real-anime-cutout.yml"
  workflow_dispatch:
    inputs:
      model:
        description: "Local inference model (no paid API)"
        required: true
        type: choice
        default: isnet-anime
        options:
          - isnet-anime
          - birefnet-portrait

permissions:
  contents: read

concurrency:
  group: real-anime-cutout-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cutout:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CUTOUT_MODEL: ${{ inputs.model || 'isnet-anime' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-avatar-cutout.txt
      - name: Cache local model weights
        uses: actions/cache@v4
        with:
          path: ~/.rembg
          key: ${{ runner.os }}-rembg-${{ env.CUTOUT_MODEL }}-2.0.85-v1
      - name: Install CPU inference dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-avatar-cutout.txt "Pillow>=10.0.0"
      - name: Run real inference on a repository anime illustration
        run: >-
          python scripts/run_real_anime_cutout_inference.py
          --input from-PixAI-2034984086876227343-0.png
          --output artifacts/real-anime-cutout
          --model "${{ env.CUTOUT_MODEL }}"
      - name: Upload real cutout, alpha mask, and visual preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-anime-cutout-${{ env.CUTOUT_MODEL }}-${{ github.run_id }}
          path: artifacts/real-anime-cutout/
          if-no-files-found: warn
          retention-days: 14

name: Generate character assets without an API key

on:
  schedule:
    - cron: "15 8 * * *"
  workflow_dispatch:
    inputs:
      character_id:
        description: Character receiving the generated assets
        type: choice
        required: true
        default: pibara
        options:
          - pibara
          - sunna
          - chie
      reference_image:
        description: Exact repository-relative path to the confirmed character reference
        type: string
        required: true
        default: from-PixAI-2034984086876227343-0.png
      asset_pack:
        description: One asset pack per run
        type: choice
        required: true
        default: hair-core-5
        options:
          - hair-core-5
          - expressions-core-5
          - eyes-4
          - accessories-4
          - face-details-4
      background:
        description: Also produce transparent PNG cutouts
        type: choice
        required: true
        default: transparent
        options:
          - transparent
          - keep
      base_seed:
        description: Base seed for the fixed-seed variant batch
        type: number
        required: true
        default: 1201

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: character-assets-free-space
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout code and existing generated assets only
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            .github
            scripts
            tests
            data
            docs
            generated/character-assets
          sparse-checkout-cone-mode: true

      - name: Validate request
        env:
          CHARACTER_ID: ${{ inputs.character_id || 'pibara' }}
          REFERENCE_IMAGE: ${{ inputs.reference_image || 'from-PixAI-2034984086876227343-0.png' }}
          ASSET_PACK: ${{ inputs.asset_pack || 'hair-core-5' }}
          BACKGROUND: ${{ inputs.background || 'transparent' }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import PurePosixPath
          cid = os.environ["CHARACTER_ID"]
          source = os.environ["REFERENCE_IMAGE"].strip()
          p = PurePosixPath(source)
          if cid not in {"pibara", "sunna", "chie"}:
              raise SystemExit("Unknown character id.")
          if not source or p.is_absolute() or ".." in p.parts or "\\" in source:
              raise SystemExit("Reference must be a safe repository-relative path.")
          if p.suffix.lower() not in {".png", ".jpg", ".jpeg", ".webp"}:
              raise SystemExit("Reference must be PNG, JPG/JPEG or WebP.")
          if os.environ["ASSET_PACK"] not in {"hair-core-5", "expressions-core-5", "eyes-4", "accessories-4", "face-details-4"}:
              raise SystemExit("Unsupported asset pack.")
          if os.environ["BACKGROUND"] not in {"transparent", "keep"}:
              raise SystemExit("Unsupported background mode.")
          print(f"Character={cid}; reference={source}; pack={os.environ['ASSET_PACK']}")
          PY

      - name: Install public-Space client and transparent-cutout processor
        run: |
          python -m pip install --disable-pip-version-check --upgrade "gradio_client>=1.12,<2" "Pillow>=10" "requests>=2.31" "rembg[cpu]>=2.0.60,<3"

      - name: Run the generator configuration tests
        run: python -m unittest discover -s tests -p "test_character_asset_factory.py"

      - name: Generate assets from the immutable GitHub reference
        id: generate_assets
        env:
          REPOSITORY: ${{ github.repository }}
          SOURCE_REF: ${{ github.sha }}
          CHARACTER_ID: ${{ inputs.character_id || 'pibara' }}
          REFERENCE_IMAGE: ${{ inputs.reference_image || 'from-PixAI-2034984086876227343-0.png' }}
          ASSET_PACK: ${{ inputs.asset_pack || 'hair-core-5' }}
          RUN_ID: ${{ github.run_id }}
          BASE_SEED: ${{ inputs.base_seed || '1201' }}
          BACKGROUND: ${{ inputs.background || 'transparent' }}
        run: |
          set -euo pipefail
          args=(
            --repository "$REPOSITORY"
            --ref "$SOURCE_REF"
            --character "$CHARACTER_ID"
            --reference "$REFERENCE_IMAGE"
            --pack "$ASSET_PACK"
            --run-id "$RUN_ID"
            --root "$GITHUB_WORKSPACE"
            --seed "$BASE_SEED"
          )
          if [ "$BACKGROUND" = "keep" ]; then
            args+=(--keep-background)
          fi
          python scripts/generate_character_assets_free.py "${args[@]}"

      - name: Preserve generated assets even when the public Space hits its quota
        if: always() && steps.generate_assets.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: character-assets-${{ inputs.character_id || 'pibara' }}-${{ github.run_id }}
          path: generated/character-assets/${{ inputs.character_id || 'pibara' }}/**/run-${{ github.run_id }}/**
          if-no-files-found: ignore
          retention-days: 14

      - name: Open a pull request with generated assets
        if: always() && steps.generate_assets.outcome != 'skipped'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: main
          branch: generated/character-assets-${{ inputs.character_id || 'pibara' }}-${{ github.run_id }}
          delete-branch: true
          commit-message: "Add generated character assets for ${{ inputs.character_id || 'pibara' }}"
          title: "Add generated character assets: ${{ inputs.character_id || 'pibara' }} / ${{ inputs.asset_pack || 'hair-core-5' }}"
          body: |
            ## Generated character assets

            - Character: ${{ inputs.character_id || 'pibara' }}
            - Source image: ${{ inputs.reference_image || 'from-PixAI-2034984086876227343-0.png' }}
            - Pack: ${{ inputs.asset_pack || 'hair-core-5' }}
            - Generator: public Hugging Face Space conradlocke/krea2-identity-edit
            - OpenAI API key: not used
            - Original image files: not modified

            Includes source provenance, exact prompts, a contact sheet, full PNG renders and (unless disabled) transparent cutouts. Partial batches are preserved as artifacts and pull requests; a later daily run resumes missing variants. Identity and cutout edges still need visual review.
          add-paths: |
            generated/character-assets/
            data/character-prompt-registry.json

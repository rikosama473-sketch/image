name: Validate IMAGE tools

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lightweight audit requirements
        run: python -m pip install -r requirements.txt
      - name: Check Python syntax
        run: python -m compileall -q scripts ml tests
      - name: Run audit-tool tests
        run: python -m unittest discover -s tests -v

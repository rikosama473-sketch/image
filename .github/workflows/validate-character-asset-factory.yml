name: Validate no-key character asset generator

on:
  pull_request:
    paths:
      - "scripts/generate_character_assets_free.py"
      - "scripts/select_next_character_asset_task.py"
      - "tests/test_character_asset_factory.py"
      - "tests/test_character_asset_queue.py"
      - ".github/workflows/generate-character-assets-free.yml"
      - ".github/workflows/validate-character-asset-factory.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            scripts
            tests
          sparse-checkout-cone-mode: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install lightweight test dependencies
        run: python -m pip install --disable-pip-version-check "Pillow>=10" "requests>=2.31"
      - name: Compile generator
        run: python -m py_compile scripts/generate_character_assets_free.py scripts/select_next_character_asset_task.py tests/test_character_asset_factory.py tests/test_character_asset_queue.py
      - name: Run generator tests
        run: python -m unittest discover -s tests -p "test_character_asset_*.py"

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="768" height="1280" viewBox="0 0 768 1280" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Cabello 01 — coleta alta castaña</title>
  <desc id="desc">Pieza vectorial transparente de una coleta larga y alta, dibujada como extensión del peinado castaño de la referencia 12.png. Sin rostro ni cuerpo.</desc>
  <defs>
    <linearGradient id="hair" x1="438" y1="52" x2="594" y2="260" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6b4545"/>
      <stop offset=".35" stop-color="#513638"/>
      <stop offset=".7" stop-color="#3e2c31"/>
      <stop offset="1" stop-color="#6a4141"/>
    </linearGradient>
    <linearGradient id="shine" x1="464" y1="62" x2="568" y2="234" gradientUnits="userSpaceOnUse">
      <stop stop-color="#bd827b"/>
      <stop offset=".48" stop-color="#95605e"/>
      <stop offset="1" stop-color="#734849" stop-opacity=".15"/>
    </linearGradient>
    <linearGradient id="bow" x1="408" y1="34" x2="474" y2="94" gradientUnits="userSpaceOnUse">
      <stop stop-color="#60404d"/>
      <stop offset=".5" stop-color="#30242f"/>
      <stop offset="1" stop-color="#211b27"/>
    </linearGradient>
  </defs>
